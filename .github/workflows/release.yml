name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag that disagrees with VERSION would publish a library reporting a
  # version it is not, so this runs before anything is built.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency
        run: python3 tools/check_version.py
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "tag v$tag does not match VERSION ($file)" >&2
            exit 1
          fi

  build:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # The shared library is what every non-C binding loads, so it ships
      # beside the CLI and the header rather than only in a source tarball.
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p stage/include
          cp -r include/dragoman stage/include/
          cp LICENSE README.md stage/
          for f in build/libdragoman.so* build/libdragoman*.dylib \
                   build/Release/dragoman.dll build/Release/dragoman.lib \
                   build/dragoman build/Release/dragoman.exe; do
            [ -e "$f" ] && cp "$f" stage/ || true
          done
          ls -la stage

      - uses: actions/upload-artifact@v4
        with:
          name: dragoman-${{ matrix.name }}
          path: stage/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package each platform
        run: |
          cd artifacts
          for dir in */; do
            tar czf "../${dir%/}.tar.gz" -C "$dir" .
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
