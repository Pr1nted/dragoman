name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing is released until CI has passed on this exact commit.
  #
  # Named "wait for CI" rather than anything with "must pass" in it: when this
  # workflow goes red because a later job failed, the job list is the first
  # thing anyone reads, and a gate called "CI must pass first" sitting at the
  # top of a failed run reads like CI is what broke.
  #
  # A tag used to start this workflow and the CI run side by side, so a release
  # could be built, attached and published while CI was still going -- or after
  # it had already failed. A release that its own tests reject is worse than no
  # release, because it is the one people install.
  gate:
    name: wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI on this commit
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: version consistency
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
      - name: Wait for every platform
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          running-workflow-name: ${{ github.workflow }}
          check-regexp: '^(ubuntu|macos|windows)-latest$'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

  # A tag that disagrees with VERSION would publish a library reporting a
  # version it is not, so this runs before anything is built.
  check:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency
        run: python3 tools/check_version.py
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "tag v$tag does not match VERSION ($file)" >&2
            exit 1
          fi

  build:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # The shared library is what every non-C binding loads, so it ships
      # beside the CLI and the header rather than only in a source tarball.
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p stage/include
          cp -r include/dragoman stage/include/
          cp LICENSE README.md stage/
          for f in build/libdragoman.so* build/libdragoman*.dylib \
                   build/Release/dragoman.dll build/Release/dragoman.lib \
                   build/dragoman build/Release/dragoman.exe; do
            [ -e "$f" ] && cp "$f" stage/ || true
          done
          ls -la stage

      - uses: actions/upload-artifact@v4
        with:
          name: dragoman-${{ matrix.name }}
          path: stage/

  # The library as a WebAssembly SIDE MODULE, for a Python that is itself
  # running in a browser.
  #
  # pygbag and Pyodide install pure-Python wheels and their own prebuilt WASM
  # ones; this library is neither, so a browser game cannot pip install it. It
  # can, however, ctypes.CDLL a side module sitting beside it -- verified in
  # pygbag's own CPython 3.12 runtime, which loads this and calls into it even
  # though it was built with a different emscripten.
  #
  # Shipped as a release asset rather than a wheel because there is no wheel
  # tag that means "loadable by whatever CPython the browser happens to have".
  wasm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14

      - name: Build the side module
        run: |
          set -e
          # nlohmann/json is vendored flat; the sources include it by its
          # canonical path, so it is staged under that name for this build.
          mkdir -p wasm-include/nlohmann
          cp third_party/json/json.hpp wasm-include/nlohmann/
          em++ -std=c++17 -O2 -fPIC -sSIDE_MODULE=1 \
               -I include -I src -I wasm-include \
               -I third_party/miniz -I third_party/stb \
               src/*.cpp third_party/miniz/*.c third_party/stb/*.c \
               -o libdragoman.so
          ls -la libdragoman.so

      # A side module that linked is not the same as one a browser Python can
      # open. Node's WASM is the same engine, so ctypes here answers the same
      # question without a browser in the loop.
      - name: It loads and answers
        run: |
          set -e
          npm install --silent pyodide
          cat > check.mjs <<'JS'
          import { loadPyodide } from "pyodide";
          import fs from "fs";
          const py = await loadPyodide();
          py.FS.writeFile("/libdragoman.so", new Uint8Array(fs.readFileSync("libdragoman.so")));
          py.runPython(`
          import ctypes
          lib = ctypes.CDLL("/libdragoman.so")
          lib.dg_version_string.restype = ctypes.c_char_p
          lib.dg_abi_version.restype = ctypes.c_int
          result = lib.dg_version_string().decode() + " abi " + str(lib.dg_abi_version())
          `);
          const got = py.globals.get("result");
          console.log("side module says:", got);
          if (!got.startsWith(process.env.EXPECT)) {
            console.error("expected version " + process.env.EXPECT);
            process.exit(1);
          }
          JS
          EXPECT="$(cat VERSION)" node check.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dragoman-wasm
          path: libdragoman.so


  # One jar for Java and Kotlin, carrying every platform's library.
  #
  # WHY THE JAR HOLDS THE NATIVES. JNA searches the classpath under
  # <os>-<arch>/, so a jar laid out this way needs nothing installed on the
  # consumer's machine -- which is the whole reason to ship a jar rather than
  # a source tree. The directory names are JNA's own (Platform.RESOURCE_PREFIX)
  # and are NOT the names this workflow's matrix uses; getting one wrong gives
  # a jar that builds, publishes, and then cannot find its library at runtime
  # on exactly one platform.
  #
  # Built with javac rather than Gradle on purpose. The binding is nine files
  # and one dependency, the test is a main() with plain assertions, and a
  # wrapper jar plus a Gradle download would be more moving parts than the
  # thing they build.
  jvm:
    name: jvm binding
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The binding targets Java 8; this is just the compiler that emits it.
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay the natives out where JNA looks
        shell: bash
        run: |
          set -e
          mkdir -p jar/darwin-aarch64 jar/linux-x86-64 jar/win32-x86-64
          cp artifacts/dragoman-macos-arm64/libdragoman.dylib   jar/darwin-aarch64/
          cp artifacts/dragoman-linux-x86_64/libdragoman.so     jar/linux-x86-64/
          cp artifacts/dragoman-windows-x86_64/dragoman.dll     jar/win32-x86-64/
          find jar -type f | sort

      - name: Build and test
        shell: bash
        run: |
          set -e
          JNA=5.14.0
          curl -sfL -o jna.jar \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA/jna-$JNA.jar"

          cd bindings/jvm
          mkdir -p ../../classes
          javac -source 8 -target 8 -nowarn -cp ../../jna.jar -d ../../classes \
                $(find src/main/java src/test/java -name '*.java')
          cd ../..
          cp -r classes/com jar/

          # THE REAL ARTICLE, not a copy built to test with: the test runs
          # against the jar that is about to be published, with no library path
          # set, so it passes only if the natives are where JNA will look for
          # them. A test against the loose classes would prove nothing about
          # the layout, which is the part that can silently be wrong.
          jar cf dragoman-jvm.jar -C jar .

          # EVERY platform's library is in there. Checked here because the one
          # this runner can load is the only one the test below can speak for:
          # a jar missing the Windows dll passes on Linux and fails for a user.
          for want in darwin-aarch64/libdragoman.dylib \
                      linux-x86-64/libdragoman.so \
                      win32-x86-64/dragoman.dll; do
            unzip -l dragoman-jvm.jar | grep -q "$want" || {
              echo "::error::$want is missing from the jar, so that platform would "\
                   "find no library at runtime"; exit 1; }
          done

          # THE REAL ARTICLE, not a copy built to test with: run against the jar
          # that is about to be published, with no library path set, so it
          # passes only if the native is where JNA looks. No map is given, so
          # the conversion case reports a skip -- what this proves is the
          # loading and the ABI check, which is the part packaging can break.
          # Converting is covered by the C++ suite on every platform.
          java -cp dragoman-jvm.jar:jna.jar \
               com.opendoctrines.dragoman.DragomanTest

      - uses: actions/upload-artifact@v4
        with:
          name: dragoman-jvm
          path: dragoman-jvm.jar

  publish:
    needs: [build, wasm, jvm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package each platform
        run: |
          cd artifacts
          for dir in */; do
            # The jar is already a distributable archive; wrapping it in a
            # tarball would make a consumer unpack one to get the other.
            [ "${dir%/}" = "dragoman-jvm" ] && continue
            tar czf "../${dir%/}.tar.gz" -C "$dir" .
          done
          cp dragoman-jvm/dragoman-jvm.jar ../dragoman-jvm.jar
          # The side module goes up on its own as well as in its tarball: a
          # browser game fetches this one file by name, and asking it to
          # unpack a tarball to get at it helps nobody.
          cp dragoman-wasm/libdragoman.so ../libdragoman.so
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            libdragoman.so
            dragoman-jvm.jar
          generate_release_notes: true
