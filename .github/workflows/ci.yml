name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The library is meant to be linked from a C++ game on Windows and imported
  # from a pygame project on Linux, so both are built every time rather than
  # on release only.
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDRAGOMAN_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The ctypes binding is the one that breaks silently: a symbol that is
      # not exported still builds and still passes every C++ test, and only
      # fails at the first dlsym. So the binding is imported and used for
      # real, on every platform, rather than merely installed.
      - name: Python binding
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python tests/test_python.py
        env:
          DRAGOMAN_BUILD_DIR: ${{ github.workspace }}/build

      # The only step that tests the *installed* library rather than the build
      # tree: a separate project, find_package, the public headers. It is what
      # catches a missing package config, or a static archive that cannot link
      # on its own -- and it is the only thing that reproduced the namespace
      # collision between the C++ wrapper and the library's own types, which
      # every in-tree test passed straight through.
      - name: C++ consumer against the installed library
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$PWD/_prefix"
          cmake -S bindings/cpp -B _consumer -DCMAKE_PREFIX_PATH="$PWD/_prefix"
          cmake --build _consumer --config Release

      - name: CLI smoke test
        shell: bash
        run: |
          BIN=build/dragoman
          [ -f build/Release/dragoman.exe ] && BIN=build/Release/dragoman.exe
          "$BIN" version
          "$BIN" --help

  # The version appears in VERSION, the C header, the Python package and the
  # CMake project. test_version asserts they agree, but it only runs where the
  # library builds; this job fails the pull request that changed three of the
  # four regardless.

  # Every binding, against a library built here.
  #
  # Each one wraps the same flat ABI and each one can get it wrong in its own
  # way -- the JVM binding read dg_roundtrip_check with dg_convert's convention
  # and reported a holding round trip as a failure, which compiled and looked
  # correct. A binding nothing runs is a binding that says what it did when it
  # was written.
  #
  # Linux only, deliberately: what is being tested is the binding, not the
  # platform, and the library itself is already built on three.
  bindings:
    name: bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the shared library
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DDRAGOMAN_BUILD_SHARED=ON \
                -DDRAGOMAN_BUILD_TESTS=OFF -DDRAGOMAN_BUILD_CLI=OFF
          cmake --build build -j

      # ---- Java and Kotlin ----
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: JVM binding
        run: |
          set -e
          JNA=5.14.0
          curl -sfL -o jna.jar \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA/jna-$JNA.jar"
          cd bindings/jvm
          javac -source 8 -target 8 -nowarn -cp ../../jna.jar -d /tmp/jvm \
                $(find src -name '*.java')
          java -cp /tmp/jvm:../../jna.jar \
               -Ddragoman.library.path=$GITHUB_WORKSPACE/build/libdragoman.so \
               com.opendoctrines.dragoman.DragomanTest

      # ---- Rust ----
      - name: Rust binding
        run: |
          cd bindings/rust
          DRAGOMAN_LIB_DIR=$GITHUB_WORKSPACE/build \
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build \
          cargo test

      # ---- JavaScript and TypeScript ----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node binding
        run: |
          cd bindings/js
          npm install --no-audit --no-fund
          DRAGOMAN_LIBRARY=$GITHUB_WORKSPACE/build/libdragoman.so npm test
          # The types are hand-written, so nothing but a typechecker says
          # whether they still match the JavaScript beside them.
          npx tsc --noEmit

      # ---- Zig ----
      #
      # This is the only place build.zig runs. Its build runner cannot link on
      # a current macOS -- an empty build.zig fails there too -- so the file is
      # unexercised by hand and this job is what keeps it honest.
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.15.1
      - name: Zig binding
        run: |
          cd bindings/zig
          zig build test \
            -Ddragoman-lib=$GITHUB_WORKSPACE/build \
            -Ddragoman-include=$GITHUB_WORKSPACE/include

  version-consistency:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare every copy of the version
        run: python3 tools/check_version.py

  # The strongest test there is, and the one CI cannot run on its own: the
  # maps the two games actually ship. Neither project's maps are ours to
  # redistribute, so this job only does anything when a fork provides them.
  conformance:
    name: real maps
    runs-on: ubuntu-latest
    if: vars.DRAGOMAN_MAP_SOURCE != ''
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Fetch maps
        run: git clone --depth 1 "${{ vars.DRAGOMAN_MAP_SOURCE }}" maps
      - name: Round trip every map
        run: python3 tools/conformance.py maps
