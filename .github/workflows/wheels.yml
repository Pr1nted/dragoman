# Wheels for PyPI, so that installing this is `pip install open-dragoman` and not a
# paragraph about CMake.
#
# The wheel carries the compiled library inside the package, so there is no
# compiler needed at install time and nothing to locate afterwards. That
# matters for who this is for: Greater Diplomacy 5 is a pygame project whose
# players install it by unzipping it, and asking them to build a C++ library to
# convert a map is asking them not to bother.
#
# PUBLISHING NEEDS ONE SETUP STEP, ONCE. On PyPI, add this repository as a
# trusted publisher for the project `open-dragoman`:
#   https://pypi.org/manage/account/publishing/
#   owner: Pr1nted   repository: dragoman   workflow: wheels.yml
#   environment: pypi
# Until that exists the build jobs still run and attach the wheels to the run;
# only the publish job fails, and it only runs on a tag.

name: Wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "CMakeLists.txt"
      - "bindings/python/**"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

jobs:
  # Nothing is released until CI has passed on this exact commit.
  #
  # A tag used to start this workflow and the CI run side by side, so a release
  # could be built, attached and published while CI was still going -- or after
  # it had already failed. A release that its own tests reject is worse than no
  # release, because it is the one people install.
  gate:
    name: CI must pass first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI on this commit
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: version consistency
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
      - name: Wait for every platform
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          running-workflow-name: ${{ github.workflow }}
          check-regexp: '^(ubuntu|macos|windows)-latest$'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

  build:
    name: ${{ matrix.os }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # One wheel per platform rather than per interpreter: the library is
      # loaded by ctypes, so it does not care which Python is calling it.
      # cibuildwheel still builds under one interpreter per platform and the
      # test-command below proves each result actually loads.
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp311-*"
          # The wheel is tagged from this, and the library is built against it.
          # Left unset, cibuildwheel tags macosx_10_9 while CMake builds for
          # 11.0, and delocate refuses the mismatch -- which is exactly how the
          # 0.2.1 macOS wheel failed.
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      # Built from a clean checkout so the sdist is proved to contain
      # everything CMake needs -- an sdist that cannot build is worse than none.
      - name: The sdist must build on its own
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          python -c "import dragoman; print(dragoman.library_version())"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write        # trusted publishing; no API token to leak
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
