[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dragoman"
version = "0.2.0"
description = "Translate maps between Open Doctrines and Greater Diplomacy 5"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["grand-strategy", "map", "conversion", "opendoctrines", "greater-diplomacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: File Formats",
]
# No dependencies on purpose. The binding is ctypes, so installing it needs no
# compiler -- which matters because Greater Diplomacy 5 is a pygame project
# whose players install it by unzipping it.
dependencies = []

[project.urls]
Homepage = "https://github.com/Pr1nted/dragoman"
Documentation = "https://github.com/Pr1nted/dragoman/tree/main/docs"

[tool.setuptools]
packages = ["dragoman"]

[tool.setuptools.package-data]
# The shared library, when a wheel is built with one alongside. A source
# install finds it in the CMake build tree instead; see dragoman/_ffi.py.
dragoman = ["*.so", "*.dylib", "*.dll"]
